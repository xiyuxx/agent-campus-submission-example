[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "small-shadow-agent"
version = "0.1.0"
description = "素材审核与发布排期 CLI Agent；仅保存草稿"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
shadow-agent = "shadow_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadow_agent = ["migrations/*.sql", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: explicit opt-in calls to the real model"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
